[project]
name = "ai-toolkit-api"
version = "0.0.1"
authors = [
  { name="Daniel Hathaway", email="dhathawaycode@proton.me" },
]
description = "A toolkit to facilitate AI interactions."
readme = "README.md"
requires-python = ">=3.12.3"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "GPL-3.0-or-later"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/dhathaway/ai-toolkit-api"

[tool.fastapi]
entrypoint = "main:app"
